<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>AAYSSA Member Portal</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f7f6f3;
      color: #222;
    }


    /* =====================================================
       AAYSSA WEBSITE HEADER
       ===================================================== */

    .site-header {
      width: 100%;
      background: #000;
    }

    .site-header-inner {
      max-width: 1650px;
      min-height: 184px;
      margin: 0 auto;
      padding: 18px 70px;

      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .site-logo-link {
      display: block;
      text-decoration: none;
    }

    .site-logo {
      width: 145px;
      height: 145px;
      object-fit: contain;
      display: block;
    }

    .site-nav {
      display: flex;
      align-items: center;
      gap: 46px;
    }

    .site-nav a {
      color: #ddd;
      text-decoration: none;
      font-size: 16px;
      letter-spacing: 1.4px;
      font-weight: 400;
      white-space: nowrap;
      transition: color 0.2s ease;
    }

    .site-nav a:hover {
      color: #fff;
    }

    .site-nav .active {
      color: #fff;
    }

    .mobile-menu-button {
      display: none;
      background: transparent;
      border: 0;
      color: white;
      font-size: 30px;
      cursor: pointer;
      padding: 8px;
    }


    /* =====================================================
       PORTAL HEADING
       ===================================================== */

    .portal-heading {
      text-align: center;
      padding: 70px 20px 38px;
      background: white;
    }

    .portal-heading h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 52px;
      font-weight: 400;
      letter-spacing: 1px;
      color: #111;
    }

    .heading-divider {
      width: 62px;
      height: 2px;
      background: #ddd;
      margin: 34px auto 28px;
    }

    .mantra {
      color: #b56800;
      font-size: 20px;
      font-weight: 700;
    }


    /* =====================================================
       MAIN PAGE
       ===================================================== */

    .page {
      max-width: 1120px;
      margin: 0 auto;
      padding: 38px 18px 55px;
    }

    .welcome {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 25px;
      font-weight: 400;
      margin-bottom: 22px;
    }


    /* =====================================================
       MEMBER CARDS
       ===================================================== */

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }

    .section-card,
    .dashboard-card,
    .trend-card,
    .directory-card {
      background: white;
      border: 1px solid #e8e5df;
      border-radius: 12px;
      padding: 22px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.045);
    }

    .section-card h2,
    .dashboard-card h3,
    .trend-card h3,
    .directory-card h3 {
      margin: 0 0 16px;
      color: #8b5100;
    }

    .section-card h2 {
      font-size: 18px;
    }

    .info-row {
      padding: 10px 0;
      border-bottom: 1px solid #eee;
    }

    .info-row:last-child {
      border-bottom: none;
    }

    .label {
      display: block;
      color: #777;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }

    .value {
      font-size: 15px;
      overflow-wrap: anywhere;
    }


    /* =====================================================
       CHIPS
       ===================================================== */

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 6px;
    }

    .chip {
      background: #f4eadb;
      color: #754200;
      border-radius: 999px;
      padding: 7px 11px;
      font-size: 13px;
      font-weight: 700;
    }


    /* =====================================================
       VOLUNTEERING
       ===================================================== */

    .section-heading-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .section-heading-row h2 {
      margin: 0;
    }

    .small-action-button,
    .secondary-button,
    .danger-button {
      border: none;
      border-radius: 7px;
      padding: 9px 13px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .small-action-button {
      background: #b96c00;
      color: white;
    }

    .secondary-button {
      background: #333;
      color: white;
    }

    .danger-button {
      background: #f7e8e8;
      color: #9b2424;
    }

    .volunteer-entry {
      padding: 12px 0;
      border-bottom: 1px solid #eee;
    }

    .volunteer-entry:last-child {
      border-bottom: none;
    }

    .volunteer-name {
      font-weight: 800;
      color: #333;
    }

    .volunteer-type {
      color: #777;
      font-size: 12px;
      margin-top: 3px;
    }

    .volunteer-form {
      display: grid;
      gap: 18px;
    }

    .volunteer-form-row {
      border: 1px solid #eee;
      border-radius: 10px;
      padding: 15px;
      background: #fffdf9;
    }

    .volunteer-form-title {
      font-weight: 800;
      margin-bottom: 10px;
    }

    .form-field {
      display: grid;
      gap: 5px;
      margin-top: 10px;
    }

    .form-field label,
    .checkbox-label {
      color: #555;
      font-size: 13px;
      font-weight: 700;
    }

    .form-field input[type="text"] {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 14px;
    }

    .form-field input[type="number"],
    .form-field textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 14px;
      font-family: Arial, Helvetica, sans-serif;
    }

    .form-field textarea {
      min-height: 88px;
      resize: vertical;
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
    }

    .area-options {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 14px;
      margin-top: 9px;
    }

    .form-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }


    /* =====================================================
       COMMUNICATION PREFERENCES
       ===================================================== */

    .preference {
      display: inline-block;
      margin-right: 12px;
      margin-bottom: 8px;
      padding: 7px 11px;
      border-radius: 8px;
      background: #f4f4f4;
      font-size: 13px;
      font-weight: 700;
    }

    .preference-on {
      background: #e6f4e9;
      color: #26783c;
    }

    .preference-off {
      color: #777;
    }


    /* =====================================================
       DONATIONS
       ===================================================== */

    .donation-summary {
      padding: 15px;
      border: 1px solid #eee;
      border-radius: 10px;
      background: #fffdf9;
      margin-bottom: 14px;
    }

    .donation-total {
      font-size: 30px;
      font-weight: 800;
      color: #8b5100;
      margin-top: 4px;
    }

    .donation-meta {
      color: #777;
      font-size: 12px;
      margin-top: 4px;
    }

    .donation-payment {
      padding: 12px 0;
      border-bottom: 1px solid #eee;
    }

    .donation-payment:last-child {
      border-bottom: none;
    }

    .donation-payment-row {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      align-items: flex-start;
    }

    .donation-description {
      font-weight: 800;
      color: #333;
    }

    .donation-date {
      color: #777;
      font-size: 12px;
      margin-top: 3px;
    }

    .donation-amount {
      color: #8b5100;
      font-weight: 800;
      white-space: nowrap;
    }

    .receipt-link {
      display: inline-block;
      margin-top: 9px;
      padding: 8px 11px;
      border-radius: 7px;
      background: #333;
      color: white;
      font-size: 12px;
      font-weight: 700;
      text-decoration: none;
    }


    /* =====================================================
       BUTTONS
       ===================================================== */

    .actions {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 30px;
    }

    .edit-button,
    .logout-button,
    .login-button {
      display: inline-block;
      padding: 12px 22px;
      border-radius: 7px;
      border: none;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      text-decoration: none;
    }

    .edit-button,
    .login-button {
      background: #b96c00;
      color: white;
    }

    .edit-button:hover,
    .login-button:hover {
      background: #995900;
    }

    .logout-button {
      background: #333;
      color: white;
    }

    .logout-button:hover {
      background: #111;
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }


    /* =====================================================
       LOADING / MESSAGES
       ===================================================== */

    .loading,
    .message,
    .dashboard-loading {
      background: white;
      border: 1px solid #e8e5df;
      border-radius: 12px;
      padding: 30px;
      text-align: center;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.045);
    }

    .error {
      color: #a32929;
    }


    /* =====================================================
       ROLE BADGES
       ===================================================== */

    .admin-badge,
    .board-badge,
    .role-badge,
    .status-badge {
      display: inline-block;
      color: white;
      padding: 5px 10px;
      border-radius: 999px;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 11px;
      font-weight: 700;
      vertical-align: middle;
    }

    .admin-badge,
    .role-badge {
      background: #8b5100;
    }

    .board-badge {
      background: #555;
    }

    .status-badge {
      background: #26783c;
    }


    /* =====================================================
       DASHBOARD
       ===================================================== */

    .dashboard {
      margin-top: 38px;
      padding-top: 34px;
      border-top: 1px solid #ddd7ce;
    }

    .dashboard-header {
      margin-bottom: 20px;
    }

    .dashboard-header h2 {
      margin: 0 0 6px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 27px;
      font-weight: 400;
      color: #111;
    }

    .dashboard-header p {
      margin: 0;
      color: #777;
      font-size: 14px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 14px;
      margin-bottom: 20px;
    }

    .stat-card {
      background: white;
      border: 1px solid #e8e5df;
      border-radius: 12px;
      padding: 20px 14px;
      text-align: center;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.045);
    }

    .stat-number {
      font-size: 30px;
      font-weight: 800;
      color: #8b5100;
    }

    .stat-label {
      margin-top: 6px;
      font-size: 11px;
      color: #777;
      font-weight: 700;
      text-transform: uppercase;
      line-height: 1.4;
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
      margin-bottom: 20px;
    }

    .dashboard-row {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      padding: 10px 0;
      border-bottom: 1px solid #eee;
    }

    .dashboard-row:last-child {
      border-bottom: none;
    }

    .dashboard-number {
      font-weight: 800;
      color: #8b5100;
    }


    /* =====================================================
       REGISTRATION TREND
       ===================================================== */

    .trend-card {
      margin-top: 20px;
    }

    .trend-subtitle,
    .directory-subtitle {
      color: #777;
      font-size: 13px;
      margin-top: -8px;
      margin-bottom: 22px;
    }

    .trend-chart-scroll {
      width: 100%;
      overflow-x: auto;
      padding-bottom: 6px;
    }

    .trend-chart {
      min-width: 700px;
      height: 300px;
      display: flex;
      align-items: flex-end;
      gap: 10px;
      border-bottom: 2px solid #ddd;
      padding: 30px 10px 0;
    }

    .trend-column {
      flex: 1;
      min-width: 44px;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
    }

    .trend-count {
      min-height: 20px;
      margin-bottom: 5px;
      font-size: 12px;
      font-weight: 800;
      color: #8b5100;
    }

    .trend-bar-area {
      width: 100%;
      height: 210px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    .trend-bar {
      width: 65%;
      max-width: 48px;
      min-width: 16px;
      background: linear-gradient(
        180deg,
        #c77a10,
        #8b5100
      );
      border-radius: 7px 7px 0 0;
      min-height: 3px;
    }

    .trend-label {
      min-height: 35px;
      margin-top: 8px;
      color: #666;
      font-size: 11px;
      font-weight: 700;
      text-align: center;
      line-height: 1.25;
      white-space: nowrap;
    }


    /* =====================================================
       MEMBER DIRECTORY
       ===================================================== */

    .directory-card {
      margin-top: 20px;
    }

    .directory-toolbar {
      display: flex;
      gap: 10px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    .directory-search {
      flex: 1;
      min-width: 220px;
      padding: 12px 14px;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 14px;
      outline: none;
    }

    .directory-search:focus {
      border-color: #b96c00;
      box-shadow: 0 0 0 2px rgba(185, 108, 0, 0.12);
    }

    .directory-search-button {
      border: none;
      background: #b96c00;
      color: white;
      padding: 12px 20px;
      border-radius: 7px;
      font-weight: 700;
      cursor: pointer;
    }

    .directory-search-button:hover {
      background: #995900;
    }

    .directory-results {
      display: grid;
      gap: 14px;
    }

    .member-card {
      border: 1px solid #eee;
      border-radius: 10px;
      padding: 18px;
      background: #fffdf9;
    }

    .member-card-header {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
      margin-bottom: 15px;
      flex-wrap: wrap;
    }

    .member-name {
      font-size: 17px;
      font-weight: 800;
      color: #333;
    }

    .member-meta {
      font-size: 12px;
      color: #777;
      margin-top: 4px;
    }

    .member-detail-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px 20px;
    }

    .pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      margin-top: 22px;
      flex-wrap: wrap;
    }

    .page-button {
      border: none;
      padding: 10px 16px;
      border-radius: 7px;
      cursor: pointer;
      background: #333;
      color: white;
      font-weight: 700;
    }

    .page-info {
      color: #666;
      font-size: 13px;
      font-weight: 700;
    }

    .directory-empty {
      text-align: center;
      padding: 25px;
      color: #777;
      background: #fafafa;
      border-radius: 10px;
    }


    /* =====================================================
       FOOTER
       ===================================================== */

    .footer {
      text-align: center;
      margin-top: 42px;
      padding-top: 22px;
      border-top: 1px solid #ddd;
      font-size: 12px;
      color: #777;
    }


    /* =====================================================
       TABLET
       ===================================================== */

    @media (max-width: 1000px) {

      .site-header-inner {
        padding-left: 30px;
        padding-right: 30px;
      }

      .stats-grid {
        grid-template-columns: repeat(2, 1fr);
      }

    }


    /* =====================================================
       MOBILE HEADER
       ===================================================== */

    @media (max-width: 760px) {

      .site-header-inner {
        min-height: auto;
        padding: 14px 20px;
        flex-wrap: wrap;
      }

      .site-logo {
        width: 90px;
        height: 90px;
      }

      .mobile-menu-button {
        display: block;
      }

      .site-nav {
        display: none;
        width: 100%;
        flex-direction: column;
        align-items: flex-start;
        gap: 0;
        padding: 12px 0 8px;
      }

      .site-nav.open {
        display: flex;
      }

      .site-nav a {
        width: 100%;
        padding: 14px 4px;
        border-top: 1px solid #222;
        font-size: 13px;
      }

      .portal-heading {
        padding: 45px 15px 30px;
      }

      .portal-heading h1 {
        font-size: 34px;
      }

      .heading-divider {
        margin-top: 25px;
        margin-bottom: 22px;
      }

      .mantra {
        font-size: 17px;
      }

      .page {
        padding: 28px 14px 40px;
      }

      .grid,
      .dashboard-grid,
      .member-detail-grid {
        grid-template-columns: 1fr;
      }

    }


    @media (max-width: 430px) {

      .stats-grid {
        grid-template-columns: 1fr;
      }

      .welcome {
        font-size: 21px;
      }

    }

  </style>
</head>


<body>


<!-- =====================================================
     AAYSSA HEADER
     ===================================================== -->

<header class="site-header">

  <div class="site-header-inner">

    <a
      href="https://atlantaayyappasevasangam.org/"
      class="site-logo-link"
      aria-label="AAYSSA Home"
    >

      <img
        src="/aayssa-logo.jpg"
        alt="Atlanta Ayyappa Seva Sangam"
        class="site-logo"
      >

    </a>


    <button
      id="mobileMenuButton"
      class="mobile-menu-button"
      type="button"
      aria-label="Open menu"
      aria-expanded="false"
    >
      ☰
    </button>


    <nav
      id="siteNav"
      class="site-nav"
      aria-label="Main navigation"
    >

      <a
        href="https://atlantaayyappasevasangam.org/"
      >
        HOME
      </a>


      <a
        href="https://atlantaayyappasevasangam.org/about-us"
      >
        ABOUT US
      </a>


      <a
        href="https://atlantaayyappasevasangam.org/membership"
      >
        MEMBERSHIP
      </a>

    </nav>

  </div>

</header>



<!-- =====================================================
     PORTAL TITLE
     ===================================================== -->

<section class="portal-heading">

  <h1>
    AAYSSA MEMBER PORTAL
  </h1>

  <div class="heading-divider"></div>

  <div class="mantra">
    Swamiye Saranam Ayyappa
  </div>

</section>



<!-- =====================================================
     MEMBER PORTAL
     ===================================================== -->

<main class="page">

  <div
    id="status"
    class="loading"
  >
    Loading your membership...
  </div>


  <div class="footer">

    Atlanta Ayyappa Seva Sangam (AAYSSA)

  </div>

</main>



<script>

  let directoryCurrentPage = 1;
  let directorySearchQuery = "";


  /* =====================================================
     MOBILE MENU
     ===================================================== */

  const mobileMenuButton =
    document.getElementById(
      "mobileMenuButton"
    );


  const siteNav =
    document.getElementById(
      "siteNav"
    );


  mobileMenuButton.addEventListener(
    "click",
    () => {

      const isOpen =
        siteNav.classList.toggle(
          "open"
        );


      mobileMenuButton.setAttribute(
        "aria-expanded",
        isOpen
          ? "true"
          : "false"
      );


      mobileMenuButton.textContent =
        isOpen
          ? "✕"
          : "☰";
    }
  );



  /* =====================================================
     HELPERS
     ===================================================== */

  function escapeHtml(value) {

    return String(value ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }


  function displayValue(value) {

    if (
      value === null ||
      value === undefined ||
      value === ""
    ) {

      return "-";
    }


    return escapeHtml(value);
  }


  function getMultiSelectValues(items) {

    if (!Array.isArray(items)) {
      return [];
    }


    return items
      .map(item => {

        if (
          typeof item === "string"
        ) {

          return item;
        }


        return (
          item?.value ||
          item?.name ||
          ""
        );

      })
      .filter(Boolean);
  }


  function renderChips(items) {

    const values =
      getMultiSelectValues(items);


    if (values.length === 0) {

      return `
        <span class="value">
          -
        </span>
      `;
    }


    return `

      <div class="chips">

        ${values.map(value => `

          <span class="chip">
            ${escapeHtml(value)}
          </span>

        `).join("")}

      </div>
    `;
  }


  function hasDashboardAccess(role) {

    return (
      role === "Board" ||
      role === "Admin"
    );
  }


  function renderRoleBadge(role) {

    if (role === "Admin") {

      return `
        <span class="admin-badge">
          ADMIN
        </span>
      `;
    }


    if (role === "Board") {

      return `
        <span class="board-badge">
          BOARD
        </span>
      `;
    }


    return "";
  }


  const VOLUNTEER_AREAS = [
    "Pooja",
    "Annadhanam",
    "Bhajan",
    "Media",
    "Decorations"
  ];

  let currentMember = null;
  let currentVolunteers = [];
  let currentDonations = null;


  function formatCurrency(
    amount,
    currency = "USD"
  ) {

    return new Intl.NumberFormat(
      "en-US",
      {
        style: "currency",
        currency:
          currency || "USD"
      }
    ).format(Number(amount || 0));
  }


  function formatDate(value) {

    if (!value) {
      return "-";
    }

    const date =
      new Date(value);

    if (Number.isNaN(date.getTime())) {
      return "-";
    }

    return new Intl.DateTimeFormat(
      "en-US",
      {
        month: "short",
        day: "numeric",
        year: "numeric"
      }
    ).format(date);
  }

      new Date().getFullYear();

    if (!donations) {

      return `

            Donations & Tax Receipts
          </h2>

          <span class="value">

    const payments =

        : [];

    return `

        <div class="donation-summary">

          <span class="label">

          <div class="donation-meta">

  function renderDonationPayments(payments) {

    return payments.map(payment => `

  async function saveVolunteers(event) {

    event.preventDefault();

    const button =
      document.getElementById(
        "saveVolunteersButton"
      );

    button.disabled = true;
    button.textContent = "Saving...";

    try {
      const volunteers =
        collectVolunteerFormValues();

      const response =
        await fetch(
          "/api/update-volunteers",
          {
            method: "POST",
            credentials: "include",
            headers: {
              "Content-Type": "application/json"
            },
            body:
              JSON.stringify({
                volunteers
              })
          }
        );

      if (!response.ok) {
        throw new Error(
          "Unable to update volunteers."
        );
      }

      const data =
        await response.json();

      currentVolunteers =
        Array.isArray(data.volunteers)
          ? data.volunteers
          : [];

      restoreVolunteerSection();

    } catch (error) {
      console.error(error);

      alert(
        "Unable to update volunteering right now. Please try again."
      );

      button.disabled = false;
      button.textContent = "Save";
    }
  }


  function collectVolunteerFormValues() {

    return Array.from(
      document.querySelectorAll(
        ".volunteer-form-row"
      )
    ).map(row => {

      const type =
        row.dataset.volunteerType;

      const areas =
        Array.from(
          row.querySelectorAll(
            ".volunteer-area:checked"
          )
        ).map(input =>
          input.value
        );

      return {
        id:
          row.dataset.volunteerId || null,
        memberType:
          type,
        name:
          type === "additional"
            ? row.querySelector(".additional-name")?.value || ""
            : "",
        relationship:
          type === "additional"
            ? row.querySelector(".additional-relationship")?.value || ""
            : "",
        interested:
          Boolean(
            row.querySelector(".volunteer-interested")?.checked
          ),
        areas
      };
    });
  }

  async function saveProfileSection(
    event,
    sectionId
  ) {

    event.preventDefault();

    const form =
      event.currentTarget;

    const button =
      form.querySelector(
        ".save-profile-button"
      );

    button.disabled = true;
    button.textContent = "Saving...";

    try {
      const profile =
        collectProfileFormValues(form);

      const response =
        await fetch(
          "/api/update-profile",
          {
            method: "POST",
            credentials: "include",
            headers: {
              "Content-Type": "application/json"
            },
            body:
              JSON.stringify({
                profile
              })
          }
        );

      if (!response.ok) {
        throw new Error(
          "Unable to update profile."
        );
      }

      const data =
        await response.json();

      currentMember = {
        ...currentMember,
        ...(data.member || {})
      };

      refreshWelcomeName();

      restoreProfileSection(sectionId);

    } catch (error) {
      console.error(error);

      alert(
        "Unable to update this section right now. Please try again."
      );

      button.disabled = false;
      button.textContent = "Save";
    }
  }

        data.get("lastName") ??
        currentMember.lastName,
      spouseFirstName:
        data.get("spouseFirstName") ??
        currentMember.spouseFirstName,
      spouseLastName:
        data.get("spouseLastName") ??
        currentMember.spouseLastName,
      mobileNumber:
        data.get("mobileNumber") ??
        currentMember.mobileNumber,
      address:
        data.get("address") ??
        currentMember.address,
      noOfAdults:
        data.get("noOfAdults") ??
        currentMember.noOfAdults,
      noOfKids:
        data.get("noOfKids") ??
        currentMember.noOfKids,
      emailOptIn:
        form.elements.emailOptIn

          : currentMember.emailOptIn,
      textOptIn:
        form.elements.textOptIn
          ? form.elements.textOptIn.checked
          : currentMember.textOptIn
    };

     ===================================================== */

  function renderRegistrationTrend(
    trends,
    available
  ) {

    if (
      !available ||
      !Array.isArray(trends) ||
      trends.length === 0
    ) {

      return `

        <div class="trend-card">

          <h3>
            Registration Trends
          </h3>

          <div class="trend-subtitle">
            New family registrations during the last 12 months
          </div>

          <div class="directory-empty">
            Registration trend data is not available.
          </div>

        </div>
      `;
    }


    const maxCount =
      Math.max(
        ...trends.map(
          item =>
            Number(item.count || 0)
        ),
        1
      );


    const bars =
      trends.map(item => {

        const count =
          Number(
            item.count || 0
          );


        const percentage =
          count === 0
            ? 1
            : Math.max(
                3,
                Math.round(
                  (count / maxCount) * 100
                )
              );


        return `

          <div class="trend-column">

            <div class="trend-count">
              ${count}
            </div>


            <div class="trend-bar-area">

              <div
                class="trend-bar"
                style="height:${percentage}%"
                title="${escapeHtml(item.label)}: ${count}"
              ></div>

            </div>


            <div class="trend-label">
              ${escapeHtml(item.label)}
            </div>

          </div>
        `;

      }).join("");


    return `

      <div class="trend-card">

        <h3>
          Registration Trends
        </h3>

        <div class="trend-subtitle">
          New family registrations during the last 12 months
        </div>


        <div class="trend-chart-scroll">

          <div class="trend-chart">
            ${bars}
          </div>

        </div>

      </div>
    `;
  }


  function renderDonationTrend(donationSummary) {

    if (
      !donationSummary?.available ||
      !Array.isArray(donationSummary.monthlyDonations) ||
      donationSummary.monthlyDonations.length === 0
    ) {

      return `

        <div class="trend-card">

          <h3>
            Monthly Donations
          </h3>

          <div class="trend-subtitle">
            Zeffy donations received during the last 12 months
          </div>

          <div class="directory-empty">
            Donation trend data is not available.
          </div>

        </div>
      `;
    }


    const trends =
      donationSummary.monthlyDonations;


    const maxAmount =
      Math.max(
        ...trends.map(item =>
          Number(item.amount || 0)
        ),
        1
      );


    const bars =
      trends.map(item => {

        const amount =
          Number(item.amount || 0);


        const percentage =
          amount === 0
            ? 1
            : Math.max(
                3,
                Math.round(
                  (amount / maxAmount) * 100
                )
              );


        return `

          <div class="trend-column">

            <div class="trend-count">
              ${formatCurrency(
                amount,
                donationSummary.currency
              )}
            </div>


            <div class="trend-bar-area">

              <div
                class="trend-bar"
                style="height:${percentage}%"
                title="${escapeHtml(item.label)}: ${formatCurrency(amount, donationSummary.currency)}"
              ></div>

            </div>


            <div class="trend-label">
              ${escapeHtml(item.label)}
            </div>

          </div>
        `;

      }).join("");


    return `

      <div class="trend-card">

        <h3>
          Monthly Donations
        </h3>

        <div class="trend-subtitle">
          Zeffy donations received during the last 12 months
        </div>


        <div class="trend-chart-scroll">

          <div class="trend-chart">
            ${bars}
          </div>

        </div>

      </div>
    `;
  }



  /* =====================================================
     MEMBER DIRECTORY SHELL
     ===================================================== */

  function renderMemberDirectoryShell() {

    return `

      <div class="directory-card">

        <h3>
          Member Directory
        </h3>


        <div class="directory-subtitle">
          Search and review registered AAYSSA families
        </div>


        <div class="directory-toolbar">

          <input
            id="directorySearch"
            class="directory-search"
            type="search"
            placeholder="Search name, email, phone, seva..."
          >


          <button
            id="directorySearchButton"
            class="directory-search-button"
            type="button"
          >
            Search
          </button>

        </div>


        <div id="directoryResults">
          Loading member directory...
        </div>

      </div>
    `;
  }



  /* =====================================================
     LOAD MEMBER DIRECTORY
     ===================================================== */

  async function loadMemberDirectory(
    page = 1
  ) {

    const container =
      document.getElementById(
        "directoryResults"
      );


    if (!container) {
      return;
    }


    container.innerHTML = `

      <div class="directory-empty">
        Loading members...
      </div>
    `;


    try {

      const params =
        new URLSearchParams();


      params.set(
        "page",
        page
      );


      params.set(
        "size",
        20
      );


      if (
        directorySearchQuery
      ) {

        params.set(
          "q",
          directorySearchQuery
        );
      }


      const response =
        await fetch(

          `/api/admin-members?${params.toString()}`,

          {
            method: "GET",
            credentials: "include"
          }
        );


      if (
        response.status === 403
      ) {

        container.innerHTML = `

          <div class="directory-empty error">
            Board or administrator access required.
          </div>
        `;

        return;
      }


      if (!response.ok) {

        throw new Error(
          "Unable to load directory."
        );
      }


      const data =
        await response.json();


      const directory =
        data.directory || {};


      const members =
        Array.isArray(
          directory.members
        )
          ? directory.members
          : [];


      directoryCurrentPage =
        directory.page || 1;


      if (
        members.length === 0
      ) {

        container.innerHTML = `

          <div class="directory-empty">
            No members found.
          </div>
        `;

        return;
      }


      const memberCards =
        members.map(member => {


          const fullName =
            `${member.firstName || ""} ${member.lastName || ""}`
              .trim();


          const spouseName =
            `${member.spouseFirstName || ""} ${member.spouseLastName || ""}`
              .trim();


          return `

            <div class="member-card">


              <div class="member-card-header">


                <div>

                  <div class="member-name">
                    ${escapeHtml(
                      fullName ||
                      "AAYSSA Member"
                    )}
                  </div>


                  <div class="member-meta">

                    Registered:

                    ${displayValue(
                      member.registrationDate
                    )}

                  </div>

                </div>


                ${
                  member.role

                    ? `

                      <div>

                        <span class="role-badge">
                          ${escapeHtml(member.role)}
                        </span>


                        ${
                          member.status

                            ? `

                              <span class="status-badge">
                                ${escapeHtml(member.status)}
                              </span>

                            `

                            : ""
                        }

                      </div>
                    `

                    : ""
                }

              </div>



              <div class="member-detail-grid">


                <div class="member-detail">

                  <span class="label">
                    Email
                  </span>

                  <div class="value">
                    ${displayValue(member.email)}
                  </div>

                </div>



                <div class="member-detail">

                  <span class="label">
                    Mobile
                  </span>

                  <div class="value">
                    ${displayValue(member.mobileNumber)}
                  </div>

                </div>



                <div class="member-detail">

                  <span class="label">
                    Spouse
                  </span>

                  <div class="value">
                    ${displayValue(spouseName)}
                  </div>

                </div>



                <div class="member-detail">

                  <span class="label">
                    Family
                  </span>

                  <div class="value">

                    ${member.noOfAdults ?? 0}
                    Adults /

                    ${member.noOfKids ?? 0}
                    Kids

                  </div>

                </div>



                <div class="member-detail">

                  <span class="label">
                    Address
                  </span>

                  <div class="value">
                    ${displayValue(member.address)}
                  </div>

                </div>



                <div class="member-detail">

                  <span class="label">
                    Seva Volunteers
                  </span>

                  ${renderDirectoryVolunteers(
                    member.volunteers
                  )}

                </div>

              </div>

            </div>
          `;

        }).join("");


      container.innerHTML = `

        <div class="directory-results">
          ${memberCards}
        </div>


        <div class="pagination">


          <button
            class="page-button"
            id="directoryPrevious"
            ${
              directory.hasPreviousPage
                ? ""
                : "disabled"
            }
          >
            Previous
          </button>


          <span class="page-info">

            Page
            ${directory.page || 1}

            of

            ${directory.totalPages || 1}

            &nbsp;•&nbsp;

            ${directory.total || 0}
            Families

          </span>


          <button
            class="page-button"
            id="directoryNext"
            ${
              directory.hasNextPage
                ? ""
                : "disabled"
            }
          >
            Next
          </button>

        </div>
      `;


      const previous =
        document.getElementById(
          "directoryPrevious"
        );


      const next =
        document.getElementById(
          "directoryNext"
        );


      if (previous) {

        previous.addEventListener(
          "click",
          () =>
            loadMemberDirectory(
              directoryCurrentPage - 1
            )
        );
      }


      if (next) {

        next.addEventListener(
          "click",
          () =>
            loadMemberDirectory(
              directoryCurrentPage + 1
            )
        );
      }


    } catch (error) {

      console.error(
        "Directory error:",
        error
      );


      container.innerHTML = `

        <div class="directory-empty error">
          Unable to load member directory right now.
        </div>
      `;
    }
  }



  /* =====================================================
     DIRECTORY SEARCH
     ===================================================== */

  function setupDirectorySearch() {

    const input =
      document.getElementById(
        "directorySearch"
      );


    const button =
      document.getElementById(
        "directorySearchButton"
      );


    if (
      !input ||
      !button
    ) {
      return;
    }


    const performSearch = () => {

      directorySearchQuery =
        input.value.trim();


      directoryCurrentPage = 1;


      loadMemberDirectory(1);
    };


    button.addEventListener(
      "click",
      performSearch
    );


    input.addEventListener(
      "keydown",
      event => {

        if (
          event.key === "Enter"
        ) {

          performSearch();
        }
      }
    );
  }



  /* =====================================================
     LOAD MEMBER PROFILE
     ===================================================== */

  async function loadMember() {

    const status =
      document.getElementById(
        "status"
      );


    try {

      const response =
        await fetch(

          "/api/me",

          {
            method: "GET",
            credentials: "include"
          }
        );


      if (
        response.status === 401
      ) {

        status.className =
          "message";


        status.innerHTML = `

          <h2>
            No active login session
          </h2>


          <p>
            Please request a new secure
            AAYSSA member login link.
          </p>


          <a
            class="login-button"
            href="https://atlantaayyappasevasangam.org/member-login"
          >
            Member Login
          </a>
        `;


        return;
      }


      if (
        response.status === 403
      ) {

        status.className =
          "message error";


        status.innerHTML = `

          <h2>
            Membership Not Found
          </h2>


          <p>
            Your authenticated email
            could not be matched to an
            AAYSSA membership.
          </p>
        `;


        return;
      }


      if (!response.ok) {

        throw new Error(
          "Unable to load member profile"
        );
      }


      const data =
        await response.json();


      const member =
        data.member;

      currentMember =
        member;

      const [
        volunteers,
        donations
      ] =
        await Promise.all([
          loadMyVolunteers(),
          loadMyDonations()
        ]);

      currentVolunteers =
        volunteers;

      currentDonations =
        donations;


      const fullName =
        `${member.firstName || ""} ${member.lastName || ""}`
          .trim();


      status.className = "";


      status.innerHTML = `


        <div class="welcome">

          Welcome,
          <span id="welcomeName">
          ${escapeHtml(
            fullName ||
            "Member"
          )}
          </span>

          ${renderRoleBadge(
            member.role
          )}

        </div>



        <div class="grid">


          ${renderFamilyDetailsSection(member)}



          ${renderContactSection(member)}


          ${renderDonationSection(
            currentDonations
          )}



          ${renderVolunteerSection(
            currentVolunteers
          )}



          ${renderPreferencesSection(member)}

        </div>



        ${
          hasDashboardAccess(
            member.role
          )

            ? `

              <div class="dashboard">


                <div class="dashboard-header">

                  <h2>
                    AAYSSA Dashboard
                  </h2>

                  <p>
                    Organization-wide membership
                    and volunteer overview
                  </p>

                </div>


                <div
                  id="dashboardStats"
                  class="dashboard-loading"
                >
                  Loading dashboard statistics...
                </div>

              </div>
            `

            : ""
        }



        <div class="actions">


          ${
            member.editProfileLink

              ? `

                <a
                  class="edit-button"
                  href="${escapeHtml(
                    member.editProfileLink
                  )}"
                  target="_blank"
                  rel="noopener noreferrer"
                >
                  Edit Profile
                </a>
              `

              : ""
          }


          <button
            id="logoutButton"
            class="logout-button"
            type="button"
          >
            Logout
          </button>

        </div>
      `;


      document
        .getElementById(
          "logoutButton"
        )
        .addEventListener(
          "click",
          logout
        );

      setupVolunteerEditing();
      setupProfileEditing();


      if (
        hasDashboardAccess(
          member.role
        )
      ) {

        await loadDashboardStats();
      }


    } catch (error) {

      console.error(error);


      status.className =
        "message error";


      status.innerHTML = `

        <h2>
          Unable to Load Membership
        </h2>


        <p>
          Please try again shortly.
        </p>
      `;
    }
  }



  /* =====================================================
     DASHBOARD
     ===================================================== */

  async function loadDashboardStats() {

    const container =
      document.getElementById(
        "dashboardStats"
      );


    if (!container) {
      return;
    }


    try {

      const response =
        await fetch(

          "/api/admin-stats",

          {
            method: "GET",
            credentials: "include"
          }
        );


      if (!response.ok) {

        throw new Error(
          "Unable to load dashboard statistics."
        );
      }


      const data =
        await response.json();


      const stats =
        data.stats || {};


      const volunteer =
        stats.volunteerCounts || {};


      const participation =
        stats.volunteerParticipation || {};

      const donationSummary =
        stats.donationSummary || null;


      const volunteerSelections =

        Number(
          participation.primaryMember || 0
        )

        +

        Number(
          participation.spouse || 0
        )

        +

        Number(
          participation.otherFamilyMember || 0
        );


      container.className = "";


      container.innerHTML = `


        <div class="stats-grid">


          <div class="stat-card">

            <div class="stat-number">
              ${stats.registeredFamilies ?? 0}
            </div>

            <div class="stat-label">
              Registered Families
            </div>

          </div>



          <div class="stat-card">

            <div class="stat-number">
              ${stats.totalPeople ?? 0}
            </div>

            <div class="stat-label">
              Total People
            </div>

          </div>



          <div class="stat-card">

            <div class="stat-number">
              ${stats.totalAdults ?? 0}
            </div>

            <div class="stat-label">
              Adults
            </div>

          </div>



          <div class="stat-card">

            <div class="stat-number">
              ${stats.totalKids ?? 0}
            </div>

            <div class="stat-label">
              Kids
            </div>

          </div>



          <div class="stat-card">

            <div class="stat-number">
              ${volunteerSelections}
            </div>

            <div class="stat-label">
              Volunteer Selections
            </div>

          </div>



          <div class="stat-card">

            <div class="stat-number">
              ${
                donationSummary?.available
                  ? formatCurrency(
                      donationSummary.totalPaidThisYear,
                      donationSummary.currency
                    )
                  : "-"
              }
            </div>

            <div class="stat-label">
              Zeffy Donations This Year
            </div>

          </div>

        </div>



        <div class="dashboard-grid">


          <div class="dashboard-card">

            <h3>
              Seva Areas of Interest
            </h3>


            ${[
              "Pooja",
              "Annadhanam",
              "Bhajan",
              "Media",
              "Decorations"

            ].map(name => `

              <div class="dashboard-row">

                <strong>
                  ${name}
                </strong>

                <span class="dashboard-number">
                  ${volunteer[name] ?? 0}
                </span>

              </div>

            `).join("")}

          </div>



          <div class="dashboard-card">

            <h3>
              Volunteer Participation
            </h3>


            <div class="dashboard-row">

              <strong>
                Primary Members
              </strong>

              <span class="dashboard-number">
                ${participation.primaryMember ?? 0}
              </span>

            </div>


            <div class="dashboard-row">

              <strong>
                Spouses
              </strong>

              <span class="dashboard-number">
                ${participation.spouse ?? 0}
              </span>

            </div>


            <div class="dashboard-row">

              <strong>
                Other Family Members
              </strong>

              <span class="dashboard-number">
                ${participation.otherFamilyMember ?? 0}
              </span>

            </div>

          </div>

        </div>



        ${renderDonationTrend(
          donationSummary
        )}



        ${renderRegistrationTrend(
          stats.registrationTrends,
          stats.registrationTrendAvailable
        )}



        ${renderMemberDirectoryShell()}
      `;


      setupDirectorySearch();


      await loadMemberDirectory(1);


    } catch (error) {

      console.error(
        "Dashboard error:",
        error
      );


      container.className =
        "dashboard-loading error";


      container.innerHTML =

        "Unable to load dashboard statistics right now.";
    }
  }



  /* =====================================================
     LOGOUT
     ===================================================== */

  async function logout() {

    const button =
      document.getElementById(
        "logoutButton"
      );


    if (button) {

      button.disabled = true;

      button.textContent =
        "Logging out...";
    }


    try {

      const response =
        await fetch(

          "/api/logout",

          {
            method: "POST",
            credentials: "include"
          }
        );


      if (!response.ok) {

        throw new Error(
          "Logout failed"
        );
      }


      window.location.href =
        "https://atlantaayyappasevasangam.org/";


    } catch (error) {

      console.error(error);


      if (button) {

        button.disabled = false;

        button.textContent =
          "Logout";
      }


      alert(
        "Unable to log out right now. Please try again."
      );
    }
  }



  /* =====================================================
     START PORTAL
     ===================================================== */

  loadMember();

</script>

</body>
</html>
