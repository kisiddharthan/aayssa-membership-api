<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>AAYSSA Member Portal</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f6f3ed;
      color: #222;
    }

    .topbar {
      background: #111;
      color: white;
      padding: 14px 22px;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .topbar img {
      width: 54px;
      height: 54px;
      object-fit: contain;
      border-radius: 8px;
      background: white;
    }

    .topbar-title {
      font-weight: 700;
      font-size: 18px;
      line-height: 1.3;
    }

    .topbar-subtitle {
      font-size: 13px;
      opacity: 0.8;
      margin-top: 2px;
    }

    .page {
      max-width: 1100px;
      margin: 0 auto;
      padding: 34px 18px 50px;
    }

    .hero {
      text-align: center;
      margin-bottom: 28px;
    }

    h1 {
      margin: 5px 0 8px;
      font-size: 30px;
    }

    .mantra {
      color: #a75f00;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .welcome {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 22px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }

    .section-card,
    .dashboard-card,
    .trend-card,
    .directory-card {
      background: white;
      border-radius: 14px;
      padding: 22px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.07);
    }

    .section-card h2,
    .dashboard-card h3,
    .trend-card h3,
    .directory-card h3 {
      margin: 0 0 16px;
      color: #7d4700;
    }

    .info-row {
      padding: 10px 0;
      border-bottom: 1px solid #eee;
    }

    .info-row:last-child {
      border-bottom: none;
    }

    .label {
      display: block;
      color: #777;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      margin-bottom: 3px;
    }

    .value {
      font-size: 15px;
      overflow-wrap: anywhere;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 6px;
    }

    .chip {
      background: #f3e8d5;
      color: #754200;
      border-radius: 999px;
      padding: 7px 11px;
      font-size: 13px;
      font-weight: 700;
    }

    .preference {
      display: inline-block;
      margin-right: 12px;
      margin-bottom: 8px;
      padding: 7px 11px;
      border-radius: 8px;
      background: #f4f4f4;
      font-size: 13px;
      font-weight: 700;
    }

    .preference-on {
      background: #e6f4e9;
      color: #26783c;
    }

    .preference-off {
      color: #777;
    }

    .actions {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 28px;
    }

    .edit-button,
    .logout-button,
    .login-button {
      display: inline-block;
      padding: 12px 22px;
      border-radius: 8px;
      border: none;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      text-decoration: none;
    }

    .edit-button,
    .login-button {
      background: #a75f00;
      color: white;
    }

    .logout-button {
      background: #333;
      color: white;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .loading,
    .message,
    .dashboard-loading {
      background: white;
      border-radius: 14px;
      padding: 30px;
      text-align: center;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.07);
    }

    .error {
      color: #a32929;
    }

    .dashboard {
      margin-top: 34px;
      padding-top: 30px;
      border-top: 2px solid #eadfce;
    }

    .dashboard-header {
      margin-bottom: 18px;
    }

    .dashboard-header h2 {
      margin: 0 0 5px;
      color: #7d4700;
      font-size: 24px;
    }

    .dashboard-header p {
      margin: 0;
      color: #777;
      font-size: 14px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 14px;
      margin-bottom: 20px;
    }

    .stat-card {
      background: white;
      border-radius: 14px;
      padding: 20px 14px;
      text-align: center;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.07);
    }

    .stat-number {
      font-size: 30px;
      font-weight: 800;
      color: #7d4700;
    }

    .stat-label {
      margin-top: 6px;
      font-size: 12px;
      color: #777;
      font-weight: 700;
      text-transform: uppercase;
      line-height: 1.4;
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
      margin-bottom: 20px;
    }

    .dashboard-row {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      padding: 10px 0;
      border-bottom: 1px solid #eee;
    }

    .dashboard-row:last-child {
      border-bottom: none;
    }

    .dashboard-number {
      font-weight: 800;
      color: #7d4700;
    }

    .trend-card {
      margin-top: 20px;
    }

    .trend-subtitle,
    .directory-subtitle {
      color: #777;
      font-size: 13px;
      margin-top: -8px;
      margin-bottom: 22px;
    }

    .trend-chart-scroll {
      width: 100%;
      overflow-x: auto;
      padding-bottom: 6px;
    }

    .trend-chart {
      min-width: 700px;
      height: 300px;
      display: flex;
      align-items: flex-end;
      gap: 10px;
      border-bottom: 2px solid #ddd;
      padding: 30px 10px 0;
    }

    .trend-column {
      flex: 1;
      min-width: 44px;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
    }

    .trend-count {
      min-height: 20px;
      margin-bottom: 5px;
      font-size: 12px;
      font-weight: 800;
      color: #7d4700;
    }

    .trend-bar-area {
      width: 100%;
      height: 210px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    .trend-bar {
      width: 65%;
      max-width: 48px;
      min-width: 16px;
      background: linear-gradient(180deg, #c67a12, #8a4c00);
      border-radius: 7px 7px 0 0;
      min-height: 3px;
    }

    .trend-label {
      min-height: 35px;
      margin-top: 8px;
      color: #666;
      font-size: 11px;
      font-weight: 700;
      text-align: center;
      line-height: 1.25;
      white-space: nowrap;
    }

    .directory-card {
      margin-top: 20px;
    }

    .directory-toolbar {
      display: flex;
      gap: 10px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    .directory-search {
      flex: 1;
      min-width: 220px;
      padding: 12px 14px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 14px;
    }

    .directory-search-button {
      border: none;
      background: #a75f00;
      color: white;
      padding: 12px 18px;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
    }

    .directory-results {
      display: grid;
      gap: 14px;
    }

    .member-card {
      border: 1px solid #eee;
      border-radius: 12px;
      padding: 18px;
      background: #fffdf9;
    }

    .member-card-header {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .member-name {
      font-size: 17px;
      font-weight: 800;
      color: #333;
    }

    .member-meta {
      font-size: 12px;
      color: #777;
      margin-top: 3px;
    }

    .member-detail-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px 20px;
    }

    .member-detail .label {
      margin-bottom: 3px;
    }

    .role-badge,
    .status-badge,
    .admin-badge,
    .board-badge {
      display: inline-block;
      color: white;
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
    }

    .admin-badge,
    .role-badge {
      background: #7d4700;
    }

    .board-badge {
      background: #555;
    }

    .status-badge {
      background: #26783c;
    }

    .pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      margin-top: 20px;
      flex-wrap: wrap;
    }

    .page-button {
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
      background: #333;
      color: white;
      font-weight: 700;
    }

    .page-info {
      color: #666;
      font-size: 13px;
      font-weight: 700;
    }

    .directory-empty {
      text-align: center;
      padding: 25px;
      color: #777;
      background: #fafafa;
      border-radius: 10px;
    }

    .footer {
      text-align: center;
      margin-top: 35px;
      font-size: 12px;
      color: #777;
    }

    @media (max-width: 900px) {
      .stats-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 720px) {
      .grid,
      .dashboard-grid,
      .member-detail-grid {
        grid-template-columns: 1fr;
      }

      .page {
        padding: 24px 14px 40px;
      }
    }

    @media (max-width: 430px) {
      .stats-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<header class="topbar">
  <img src="/aayssa-logo.jpg" alt="AAYSSA Logo">

  <div>
    <div class="topbar-title">
      Atlanta Ayyappa Seva Sangam
    </div>

    <div class="topbar-subtitle">
      AAYSSA Member Portal
    </div>
  </div>
</header>

<main class="page">

  <div class="hero">
    <h1>AAYSSA Member Portal</h1>

    <div class="mantra">
      Swamiye Saranam Ayyappa
    </div>
  </div>

  <div id="status" class="loading">
    Loading your membership...
  </div>

  <div class="footer">
    Atlanta Ayyappa Seva Sangam (AAYSSA)
  </div>

</main>

<script>

  let directoryCurrentPage = 1;
  let directorySearchQuery = "";


  function escapeHtml(value) {
    return String(value ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }


  function displayValue(value) {
    if (
      value === null ||
      value === undefined ||
      value === ""
    ) {
      return "-";
    }

    return escapeHtml(value);
  }


  function getMultiSelectValues(items) {
    if (!Array.isArray(items)) {
      return [];
    }

    return items
      .map(item => {
        if (typeof item === "string") {
          return item;
        }

        return item?.value || item?.name || "";
      })
      .filter(Boolean);
  }


  function renderChips(items) {
    const values = getMultiSelectValues(items);

    if (values.length === 0) {
      return `<span class="value">-</span>`;
    }

    return `
      <div class="chips">
        ${values.map(value => `
          <span class="chip">
            ${escapeHtml(value)}
          </span>
        `).join("")}
      </div>
    `;
  }


  function hasDashboardAccess(role) {
    return role === "Board" || role === "Admin";
  }


  function renderRoleBadge(role) {
    if (role === "Admin") {
      return `<span class="admin-badge">ADMIN</span>`;
    }

    if (role === "Board") {
      return `<span class="board-badge">BOARD</span>`;
    }

    return "";
  }


  function renderRegistrationTrend(trends, available) {

    if (
      !available ||
      !Array.isArray(trends) ||
      trends.length === 0
    ) {
      return `
        <div class="trend-card">
          <h3>Registration Trends</h3>

          <div class="trend-subtitle">
            New family registrations during the last 12 months
          </div>

          <div class="directory-empty">
            Registration trend data is not available.
          </div>
        </div>
      `;
    }


    const maxCount = Math.max(
      ...trends.map(item => Number(item.count || 0)),
      1
    );


    const bars = trends.map(item => {

      const count = Number(item.count || 0);

      const percentage =
        count === 0
          ? 1
          : Math.max(
              3,
              Math.round((count / maxCount) * 100)
            );

      return `
        <div class="trend-column">

          <div class="trend-count">
            ${count}
          </div>

          <div class="trend-bar-area">
            <div
              class="trend-bar"
              style="height:${percentage}%"
              title="${escapeHtml(item.label)}: ${count}"
            ></div>
          </div>

          <div class="trend-label">
            ${escapeHtml(item.label)}
          </div>

        </div>
      `;

    }).join("");


    return `
      <div class="trend-card">

        <h3>Registration Trends</h3>

        <div class="trend-subtitle">
          New family registrations during the last 12 months
        </div>

        <div class="trend-chart-scroll">
          <div class="trend-chart">
            ${bars}
          </div>
        </div>

      </div>
    `;
  }


  function renderMemberDirectoryShell() {
    return `
      <div class="directory-card">

        <h3>Member Directory</h3>

        <div class="directory-subtitle">
          Search and review registered AAYSSA families
        </div>

        <div class="directory-toolbar">

          <input
            id="directorySearch"
            class="directory-search"
            type="search"
            placeholder="Search name, email, phone, seva..."
          >

          <button
            id="directorySearchButton"
            class="directory-search-button"
            type="button"
          >
            Search
          </button>

        </div>

        <div id="directoryResults">
          Loading member directory...
        </div>

      </div>
    `;
  }


  async function loadMemberDirectory(page = 1) {

    const container =
      document.getElementById("directoryResults");

    if (!container) {
      return;
    }

    container.innerHTML =
      `<div class="directory-empty">Loading members...</div>`;


    try {

      const params = new URLSearchParams();

      params.set("page", page);
      params.set("size", 20);

      if (directorySearchQuery) {
        params.set("q", directorySearchQuery);
      }


      const response =
        await fetch(
          `/api/admin-members?${params.toString()}`,
          {
            method: "GET",
            credentials: "include"
          }
        );


      if (response.status === 403) {
        container.innerHTML = `
          <div class="directory-empty error">
            Board or administrator access required.
          </div>
        `;

        return;
      }


      if (!response.ok) {
        throw new Error(
          "Unable to load directory."
        );
      }


      const data =
        await response.json();


      const directory =
        data.directory || {};


      const members =
        Array.isArray(directory.members)
          ? directory.members
          : [];


      directoryCurrentPage =
        directory.page || 1;


      if (members.length === 0) {
        container.innerHTML = `
          <div class="directory-empty">
            No members found.
          </div>
        `;

        return;
      }


      const memberCards =
        members.map(member => {

          const fullName =
            `${member.firstName || ""} ${member.lastName || ""}`
              .trim();


          const spouseName =
            `${member.spouseFirstName || ""} ${member.spouseLastName || ""}`
              .trim();


          return `
            <div class="member-card">

              <div class="member-card-header">

                <div>

                  <div class="member-name">
                    ${escapeHtml(fullName || "AAYSSA Member")}
                  </div>

                  <div class="member-meta">
                    Registered:
                    ${displayValue(member.registrationDate)}
                  </div>

                </div>


                ${
                  member.role
                    ? `
                      <div>
                        <span class="role-badge">
                          ${escapeHtml(member.role)}
                        </span>

                        ${
                          member.status
                            ? `
                              <span class="status-badge">
                                ${escapeHtml(member.status)}
                              </span>
                            `
                            : ""
                        }
                      </div>
                    `
                    : ""
                }

              </div>


              <div class="member-detail-grid">


                <div class="member-detail">

                  <span class="label">
                    Email
                  </span>

                  <div class="value">
                    ${displayValue(member.email)}
                  </div>

                </div>


                <div class="member-detail">

                  <span class="label">
                    Mobile
                  </span>

                  <div class="value">
                    ${displayValue(member.mobileNumber)}
                  </div>

                </div>


                <div class="member-detail">

                  <span class="label">
                    Spouse
                  </span>

                  <div class="value">
                    ${displayValue(spouseName)}
                  </div>

                </div>


                <div class="member-detail">

                  <span class="label">
                    Family
                  </span>

                  <div class="value">
                    ${member.noOfAdults ?? 0}
                    Adults /
                    ${member.noOfKids ?? 0}
                    Kids
                  </div>

                </div>


                <div class="member-detail">

                  <span class="label">
                    Address
                  </span>

                  <div class="value">
                    ${displayValue(member.address)}
                  </div>

                </div>


                <div class="member-detail">

                  <span class="label">
                    Volunteer Members
                  </span>

                  ${renderChips(
                    member.volunteerInterest
                  )}

                </div>


                <div class="member-detail">

                  <span class="label">
                    Seva Interests
                  </span>

                  ${renderChips(
                    member.areasOfInterest
                  )}

                </div>

              </div>

            </div>
          `;

        }).join("");


      container.innerHTML = `

        <div class="directory-results">
          ${memberCards}
        </div>


        <div class="pagination">

          <button
            class="page-button"
            id="directoryPrevious"
            ${directory.hasPreviousPage ? "" : "disabled"}
          >
            Previous
          </button>


          <span class="page-info">

            Page
            ${directory.page || 1}
            of
            ${directory.totalPages || 1}

            &nbsp;•&nbsp;

            ${directory.total || 0}
            Families

          </span>


          <button
            class="page-button"
            id="directoryNext"
            ${directory.hasNextPage ? "" : "disabled"}
          >
            Next
          </button>

        </div>
      `;


      const previous =
        document.getElementById(
          "directoryPrevious"
        );


      const next =
        document.getElementById(
          "directoryNext"
        );


      if (previous) {
        previous.addEventListener(
          "click",
          () =>
            loadMemberDirectory(
              directoryCurrentPage - 1
            )
        );
      }


      if (next) {
        next.addEventListener(
          "click",
          () =>
            loadMemberDirectory(
              directoryCurrentPage + 1
            )
        );
      }


    } catch (error) {

      console.error(
        "Directory error:",
        error
      );


      container.innerHTML = `
        <div class="directory-empty error">
          Unable to load member directory right now.
        </div>
      `;
    }
  }


  function setupDirectorySearch() {

    const input =
      document.getElementById(
        "directorySearch"
      );


    const button =
      document.getElementById(
        "directorySearchButton"
      );


    if (!input || !button) {
      return;
    }


    const performSearch = () => {

      directorySearchQuery =
        input.value.trim();

      directoryCurrentPage = 1;

      loadMemberDirectory(1);
    };


    button.addEventListener(
      "click",
      performSearch
    );


    input.addEventListener(
      "keydown",
      event => {

        if (event.key === "Enter") {
          performSearch();
        }
      }
    );
  }


  async function loadMember() {

    const status =
      document.getElementById("status");


    try {

      const response =
        await fetch(
          "/api/me",
          {
            method: "GET",
            credentials: "include"
          }
        );


      if (response.status === 401) {

        status.className = "message";

        status.innerHTML = `
          <h2>No active login session</h2>

          <p>
            Please request a new secure
            AAYSSA member login link.
          </p>

          <a
            class="login-button"
            href="https://atlantaayyappasevasangam.org/member-login"
          >
            Member Login
          </a>
        `;

        return;
      }


      if (response.status === 403) {

        status.className =
          "message error";

        status.innerHTML = `
          <h2>Membership Not Found</h2>

          <p>
            Your authenticated email
            could not be matched to an
            AAYSSA membership.
          </p>
        `;

        return;
      }


      if (!response.ok) {
        throw new Error(
          "Unable to load member profile"
        );
      }


      const data =
        await response.json();


      const member =
        data.member;


      const fullName =
        `${member.firstName || ""} ${member.lastName || ""}`
          .trim();


      const spouseName =
        `${member.spouseFirstName || ""} ${member.spouseLastName || ""}`
          .trim();


      status.className = "";


      status.innerHTML = `

        <div class="welcome">

          Welcome,
          ${escapeHtml(fullName || "Member")}

          ${renderRoleBadge(member.role)}

        </div>


        <div class="grid">


          <section class="section-card">

            <h2>Family Details</h2>


            <div class="info-row">

              <span class="label">
                Primary Member
              </span>

              <span class="value">
                ${displayValue(fullName)}
              </span>

            </div>


            <div class="info-row">

              <span class="label">
                Spouse
              </span>

              <span class="value">
                ${displayValue(spouseName)}
              </span>

            </div>


            <div class="info-row">

              <span class="label">
                Adults
              </span>

              <span class="value">
                ${displayValue(member.noOfAdults)}
              </span>

            </div>


            <div class="info-row">

              <span class="label">
                Kids
              </span>

              <span class="value">
                ${displayValue(member.noOfKids)}
              </span>

            </div>

          </section>


          <section class="section-card">

            <h2>Contact Information</h2>


            <div class="info-row">

              <span class="label">
                Email
              </span>

              <span class="value">
                ${displayValue(member.email)}
              </span>

            </div>


            <div class="info-row">

              <span class="label">
                Mobile
              </span>

              <span class="value">
                ${displayValue(member.mobileNumber)}
              </span>

            </div>


            <div class="info-row">

              <span class="label">
                Address
              </span>

              <span class="value">
                ${displayValue(member.address)}
              </span>

            </div>

          </section>


          <section class="section-card">

            <h2>Seva & Volunteering</h2>


            <div class="info-row">

              <span class="label">
                Interested Family Members
              </span>

              ${renderChips(
                member.volunteerInterest
              )}

            </div>


            <div class="info-row">

              <span class="label">
                Areas of Interest
              </span>

              ${renderChips(
                member.areasOfInterest
              )}

            </div>

          </section>


          <section class="section-card">

            <h2>
              Communication Preferences
            </h2>


            <span class="
              preference
              ${
                member.emailOptIn
                  ? "preference-on"
                  : "preference-off"
              }
            ">
              Email:
              ${member.emailOptIn ? "Yes" : "No"}
            </span>


            <span class="
              preference
              ${
                member.textOptIn
                  ? "preference-on"
                  : "preference-off"
              }
            ">
              Text:
              ${member.textOptIn ? "Yes" : "No"}
            </span>

          </section>

        </div>


        ${
          hasDashboardAccess(member.role)
            ? `
              <div class="dashboard">

                <div class="dashboard-header">

                  <h2>
                    AAYSSA Dashboard
                  </h2>

                  <p>
                    Organization-wide membership
                    and volunteer overview
                  </p>

                </div>


                <div
                  id="dashboardStats"
                  class="dashboard-loading"
                >
                  Loading dashboard statistics...
                </div>

              </div>
            `
            : ""
        }


        <div class="actions">

          ${
            member.editProfileLink
              ? `
                <a
                  class="edit-button"
                  href="${escapeHtml(member.editProfileLink)}"
                  target="_blank"
                  rel="noopener noreferrer"
                >
                  Edit Profile
                </a>
              `
              : ""
          }


          <button
            id="logoutButton"
            class="logout-button"
            type="button"
          >
            Logout
          </button>

        </div>
      `;


      document
        .getElementById("logoutButton")
        .addEventListener(
          "click",
          logout
        );


      if (
        hasDashboardAccess(member.role)
      ) {

        await loadDashboardStats();

      }


    } catch (error) {

      console.error(error);


      status.className =
        "message error";


      status.innerHTML = `
        <h2>
          Unable to Load Membership
        </h2>

        <p>
          Please try again shortly.
        </p>
      `;
    }
  }


  async function loadDashboardStats() {

    const container =
      document.getElementById(
        "dashboardStats"
      );


    if (!container) {
      return;
    }


    try {

      const response =
        await fetch(
          "/api/admin-stats",
          {
            method: "GET",
            credentials: "include"
          }
        );


      if (!response.ok) {

        throw new Error(
          "Unable to load dashboard statistics."
        );
      }


      const data =
        await response.json();


      const stats =
        data.stats || {};


      const volunteer =
        stats.volunteerCounts || {};


      const participation =
        stats.volunteerParticipation || {};


      const volunteerSelections =
        Number(
          participation.primaryMember || 0
        ) +
        Number(
          participation.spouse || 0
        ) +
        Number(
          participation.otherFamilyMember || 0
        );


      container.className = "";


      container.innerHTML = `

        <div class="stats-grid">

          <div class="stat-card">

            <div class="stat-number">
              ${stats.registeredFamilies ?? 0}
            </div>

            <div class="stat-label">
              Registered Families
            </div>

          </div>


          <div class="stat-card">

            <div class="stat-number">
              ${stats.totalPeople ?? 0}
            </div>

            <div class="stat-label">
              Total People
            </div>

          </div>


          <div class="stat-card">

            <div class="stat-number">
              ${stats.totalAdults ?? 0}
            </div>

            <div class="stat-label">
              Adults
            </div>

          </div>


          <div class="stat-card">

            <div class="stat-number">
              ${stats.totalKids ?? 0}
            </div>

            <div class="stat-label">
              Kids
            </div>

          </div>


          <div class="stat-card">

            <div class="stat-number">
              ${volunteerSelections}
            </div>

            <div class="stat-label">
              Volunteer Selections
            </div>

          </div>

        </div>


        <div class="dashboard-grid">

          <div class="dashboard-card">

            <h3>
              Seva Areas of Interest
            </h3>

            ${[
              "Pooja",
              "Annadhanam",
              "Bhajan",
              "Media",
              "Decorations"
            ].map(name => `
              <div class="dashboard-row">

                <strong>
                  ${name}
                </strong>

                <span class="dashboard-number">
                  ${volunteer[name] ?? 0}
                </span>

              </div>
            `).join("")}

          </div>


          <div class="dashboard-card">

            <h3>
              Volunteer Participation
            </h3>


            <div class="dashboard-row">

              <strong>
                Primary Members
              </strong>

              <span class="dashboard-number">
                ${participation.primaryMember ?? 0}
              </span>

            </div>


            <div class="dashboard-row">

              <strong>
                Spouses
              </strong>

              <span class="dashboard-number">
                ${participation.spouse ?? 0}
              </span>

            </div>


            <div class="dashboard-row">

              <strong>
                Other Family Members
              </strong>

              <span class="dashboard-number">
                ${participation.otherFamilyMember ?? 0}
              </span>

            </div>

          </div>

        </div>


        ${renderRegistrationTrend(
          stats.registrationTrends,
          stats.registrationTrendAvailable
        )}


        ${renderMemberDirectoryShell()}
      `;


      setupDirectorySearch();

      await loadMemberDirectory(1);


    } catch (error) {

      console.error(
        "Dashboard error:",
        error
      );


      container.className =
        "dashboard-loading error";


      container.innerHTML =
        "Unable to load dashboard statistics right now.";
    }
  }


  async function logout() {

    const button =
      document.getElementById(
        "logoutButton"
      );


    if (button) {
      button.disabled = true;
      button.textContent =
        "Logging out...";
    }


    try {

      const response =
        await fetch(
          "/api/logout",
          {
            method: "POST",
            credentials: "include"
          }
        );


      if (!response.ok) {
        throw new Error(
          "Logout failed"
        );
      }


      window.location.href =
        "https://atlantaayyappasevasangam.org/";


    } catch (error) {

      console.error(error);


      if (button) {
        button.disabled = false;
        button.textContent = "Logout";
      }


      alert(
        "Unable to log out right now. Please try again."
      );
    }
  }


  loadMember();

</script>

</body>
</html>
