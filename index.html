<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AAYSSA Member Portal</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f7f5f1;
      color: #222;
    }

    .topbar {
      background: #000;
      color: #fff;
      padding: 18px 24px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .page {
      max-width: 900px;
      margin: 0 auto;
      padding: 45px 20px;
    }

    .card {
      background: #fff;
      border-radius: 14px;
      padding: 34px;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin-top: 0;
      text-align: center;
    }

    .mantra {
      text-align: center;
      color: #a75f00;
      font-weight: 700;
      margin-bottom: 28px;
    }

    #status {
      line-height: 1.7;
    }

    .loading,
    .message {
      text-align: center;
    }

    .member-name {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 22px;
    }

    .member-row {
      padding: 8px 0;
      border-bottom: 1px solid #eee;
    }

    .edit-button {
      display: inline-block;
      margin-top: 22px;
      padding: 12px 20px;
      background: #a75f00;
      color: white;
      text-decoration: none;
      border-radius: 7px;
      font-weight: 700;
    }

    .error {
      color: #a32929;
    }
  </style>
</head>

<body>

  <div class="topbar">
    Atlanta Ayyappa Seva Sangam (AAYSSA)
  </div>

  <div class="page">
    <div class="card">

      <h1>AAYSSA Member Portal</h1>

      <div class="mantra">
        Swamiye Saranam Ayyappa
      </div>

      <div id="status" class="loading">
        Loading your membership...
      </div>

    </div>
  </div>

  <script>
    async function loadMember() {

      const status = document.getElementById("status");

      try {

        const response = await fetch("/api/me", {
          method: "GET",
          credentials: "include"
        });

        if (response.status === 401) {

          status.className = "message";

          status.innerHTML = `
            <p><strong>No active login session was found.</strong></p>

            <p>
              Please return to the AAYSSA Member Login page
              and request a new secure login link.
            </p>

            <p>
              <a href="https://atlantaayyappasevasangam.org/member-login">
                Return to Member Login
              </a>
            </p>
          `;

          return;
        }

        if (response.status === 403) {

          status.className = "message error";

          status.innerHTML = `
            <p>
              Your authenticated email could not be matched
              to an active AAYSSA membership.
            </p>
          `;

          return;
        }

        if (!response.ok) {
          throw new Error("Unable to load member profile");
        }

        const member = await response.json();

        const spouseName =
          `${member.spouseFirstName || ""} ${member.spouseLastName || ""}`.trim();

        const membershipStatus =
          member.status?.value ||
          member.status ||
          "-";

        status.className = "";

        status.innerHTML = `

          <div class="member-name">
            Welcome, ${member.firstName || ""} ${member.lastName || ""}
          </div>

          <div class="member-row">
            <strong>Membership ID:</strong>
            ${member.membershipId || "-"}
          </div>

          <div class="member-row">
            <strong>Membership Status:</strong>
            ${membershipStatus}
          </div>

          <div class="member-row">
            <strong>Role:</strong>
            ${member.role || "Member"}
          </div>

          <div class="member-row">
            <strong>Email:</strong>
            ${member.email || "-"}
          </div>

          <div class="member-row">
            <strong>Mobile:</strong>
            ${member.mobile || "-"}
          </div>

          <div class="member-row">
            <strong>Address:</strong>
            ${member.address || "-"}
          </div>

          <div class="member-row">
            <strong>Spouse:</strong>
            ${spouseName || "-"}
          </div>

          <div class="member-row">
            <strong>Adults:</strong>
            ${member.noOfAdults ?? "-"}
          </div>

          <div class="member-row">
            <strong>Kids:</strong>
            ${member.noOfKids ?? "-"}
          </div>

          ${
            member.editProfileLink
              ? `
                <a
                  class="edit-button"
                  href="${member.editProfileLink}"
                  target="_blank"
                  rel="noopener noreferrer"
                >
                  Edit Profile
                </a>
              `
              : ""
          }
        `;

      } catch (error) {

        console.error(error);

        status.className = "message error";

        status.innerHTML = `
          <p>
            We couldn't load your member profile right now.
          </p>

          <p>
            Please try again shortly.
          </p>
        `;
      }
    }

    loadMember();
  </script>

</body>
</html>
